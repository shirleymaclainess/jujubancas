
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#f9a8d4">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jujubanças</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  background: #fff8fb;
  font-family: Inter, sans-serif;
  color: #1e293b;
}

.card {
  background: white;
  border-radius: 28px;
  padding: 22px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

.input {
  width: 100%;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 18px;
  padding: 18px;
  margin-top: 8px;
  outline: none;
}

.input:focus {
  border-color: #f472b6;
}

.btn {
  border-radius: 18px;
  padding: 16px;
  font-weight: 600;
}

.category-tag {
  background: #fce7f3;
  color: #be185d;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 13px;
}

.history-card {
  border: 1px solid #f1f5f9;
  border-radius: 22px;
  padding: 18px;
}
</style>
</head>
<body>

<div class="max-w-6xl mx-auto p-5">

<div class="flex items-center justify-between mb-6 gap-4">

<div class="flex items-center gap-4 min-w-0">

<div class="w-14 h-14 rounded-3xl bg-pink-300 flex items-center justify-center text-3xl shrink-0">
💸
</div>

<h1 class="text-3xl md:text-4xl font-bold truncate">
Jujubanças
</h1>

</div>

<div class="flex items-center gap-3 shrink-0">

<button id="installBtn"
class="btn bg-pink-500 text-white hidden px-5 py-3">
Instalar
</button>

<div class="relative">

<button onclick="toggleMenu()"
class="w-12 h-12 flex items-center justify-center rounded-2xl bg-slate-900 text-white text-2xl shadow-lg">
☰
</button>

<div id="menu"
class="hidden absolute right-0 top-14 bg-white shadow-2xl rounded-3xl p-3 w-56 z-50 border border-slate-100">

<button onclick="showView('history')"
class="w-full text-left p-4 rounded-2xl hover:bg-slate-100 transition">
Histórico
</button>

<hr class="my-2">

<button onclick="exportBackup()"
class="w-full text-left p-4 rounded-2xl hover:bg-slate-100 transition">
Exportar backup
</button>

<label class="block w-full p-4 rounded-2xl hover:bg-slate-100 transition cursor-pointer">
Importar backup
<input type="file" hidden onchange="importBackup(event)">
</label>

</div>
</div>

</div>

</div>

<div class="flex gap-3 mb-6">

<button onclick="showTab('info')"
id="tab-info"
class="bg-pink-500 text-white px-5 py-4 rounded-2xl font-semibold flex-1">
Informações
</button>

<button onclick="showTab('goal')"
id="tab-goal"
class="bg-slate-200 text-slate-700 px-5 py-4 rounded-2xl font-semibold flex-1">
Meta
</button>

</div>

<div id="dashboardView">

<div class="card mb-6">

<div class="flex justify-between text-sm text-slate-500 mb-2">
<span>Controle de gastos</span>
<span id="goalStatus">R$ 0 / R$ 0</span>
</div>

<div class="w-full h-8 bg-slate-100 rounded-full overflow-hidden">
<div id="goalBar"
class="h-full rounded-full flex items-center justify-center text-sm font-bold text-white transition-all"
style="width:0%; background:#22c55e">
0%
</div>
</div>

</div>

<div id="infoTab">

<div class="grid md:grid-cols-3 gap-5 mb-6">

<div class="card">
<p class="text-slate-500">Total gasto</p>
<h2 id="totalValue" class="text-4xl font-bold mt-4">R$ 0</h2>
</div>

<div class="card">
<p class="text-slate-500">Maior categoria</p>
<h2 id="topCategory" class="text-3xl font-bold mt-4">-</h2>
</div>

<div class="card">
<p class="text-slate-500">Registros</p>
<h2 id="totalRecords" class="text-4xl font-bold mt-4">0</h2>
</div>

</div>

<div class="grid lg:grid-cols-2 gap-6">

<div class="card">
<h2 class="text-2xl font-bold mb-6">Registrar gasto</h2>

<div class="space-y-5">

<div>
<label>Valor</label>
<input id="value" type="number" step="0.01" class="input" placeholder="Ex: 42.90">
</div>

<div>
<label>Categoria</label>
<div class="flex gap-2">
<select id="category" class="input"></select>

<button onclick="addCategory()" class="bg-pink-500 text-white px-5 rounded-2xl">
+
</button>
</div>
</div>

<div>
<label>Anotação</label>
<textarea id="note" class="input" placeholder="Ex: Comprei doce por impulso"></textarea>
</div>

<div>
<label>Data</label>
<input id="date" type="date" class="input">
</div>

<button onclick="saveExpense()" class="btn bg-pink-500 text-white w-full">
Registrar gasto
</button>

</div>
</div>

<div class="space-y-6">

<div class="card">
<h2 class="text-2xl font-bold mb-6">Categorias</h2>
<div id="categoriesList" class="flex flex-wrap gap-3"></div>
</div>

<div class="card">
<h2 class="text-2xl font-bold mb-6">Onde estou gastando</h2>
<canvas id="chart"></canvas>
</div>

</div>

</div>

</div>

<div id="goalTab" class="hidden">

<div class="card mb-6">

<div class="flex flex-col md:flex-row md:items-end gap-5">

<div class="flex-1">
<label>Meta de gastos</label>
<input id="goalLimit" type="number" class="input"
placeholder="Ex: 500">
</div>

<button onclick="saveGoal()"
class="btn bg-pink-500 text-white">
Salvar meta
</button>

</div>

</div>

</div>

</div>

<div id="historyView" class="hidden mt-6">

<div class="card">
<div class="flex items-center justify-between mb-6">
<h2 class="text-3xl font-bold">Histórico</h2>

<button onclick="showView('dashboard')"
class="bg-pink-500 text-white px-5 py-3 rounded-2xl">
Voltar
</button>
</div>

<div id="history" class="space-y-4"></div>

</div>
</div>

</div>

<script>
let expenses = JSON.parse(localStorage.getItem('jujubancas_expenses')) || [];
let categories = JSON.parse(localStorage.getItem('jujubancas_categories')) || ['Delivery','Doces'];
let currentView = 'dashboard';
let deferredPrompt;
let editingExpenseId = null;

function toggleMenu(){
document.getElementById('menu').classList.toggle('hidden');
}

function showView(view){

if(view === 'history'){
 document.getElementById('dashboardView').classList.add('hidden');
 document.getElementById('historyView').classList.remove('hidden');
}

if(view === 'dashboard'){
 document.getElementById('dashboardView').classList.remove('hidden');
 document.getElementById('historyView').classList.add('hidden');
}

const menu = document.getElementById('menu');
if(menu){
 menu.classList.add('hidden');
}
}

function showTab(tab){

const infoTab = document.getElementById('infoTab');
const goalTab = document.getElementById('goalTab');

const infoBtn = document.getElementById('tab-info');
const goalBtn = document.getElementById('tab-goal');

infoTab.classList.add('hidden');
goalTab.classList.add('hidden');

infoBtn.classList.remove('bg-pink-500','text-white');
goalBtn.classList.remove('bg-pink-500','text-white');

infoBtn.classList.add('bg-slate-200','text-slate-700');
goalBtn.classList.add('bg-slate-200','text-slate-700');

if(tab === 'info'){
 infoTab.classList.remove('hidden');
 infoBtn.classList.remove('bg-slate-200','text-slate-700');
 infoBtn.classList.add('bg-pink-500','text-white');
}

if(tab === 'goal'){
 goalTab.classList.remove('hidden');
 goalBtn.classList.remove('bg-slate-200','text-slate-700');
 goalBtn.classList.add('bg-pink-500','text-white');
}
}

function saveGoal(){
const value = Number(document.getElementById('goalLimit').value || 0);
localStorage.setItem('jujubancas_goal', value);
renderGoal();
showToast('Meta salva');
}

function renderGoal(){

const goal = Number(localStorage.getItem('jujubancas_goal') || 0);
const total = expenses.reduce((sum,item)=>sum+item.value,0);

const percent = goal > 0
? Math.min((total/goal)*100,100)
: 0;

const bar = document.getElementById('goalBar');

bar.style.width = percent + '%';
bar.innerText = Math.floor(percent) + '%';

if(percent < 70){
 bar.style.background = '#22c55e';
}

if(percent >= 70 && percent < 100){
 bar.style.background = '#f59e0b';
}

if(percent >= 100){
 bar.style.background = '#ef4444';
}

const status = document.getElementById('goalStatus');
status.innerText = `R$ ${total.toFixed(2)} / R$ ${goal.toFixed(2)}`;

const input = document.getElementById('goalLimit');
if(input){
 input.value = goal || '';
}
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').classList.remove('hidden');
});

const installBtn = document.getElementById('installBtn');

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.classList.add('hidden');
});

function saveStorage() {
  localStorage.setItem('jujubancas_expenses', JSON.stringify(expenses));
  localStorage.setItem('jujubancas_categories', JSON.stringify(categories));
}

function addCategory(){

const action = prompt(
`Digite:
1 = Nova categoria
2 = Editar categoria
3 = Remover categoria`
);

if(action === '1'){

 const name = prompt('Nome da nova categoria');

 if(!name) return;

 if(!categories.includes(name)){
  categories.push(name);
  saveStorage();
  renderCategories();
 }

 document.getElementById('category').value = name;
 showToast('Categoria adicionada');
}

if(action === '2'){

 const current = prompt('Qual categoria deseja editar?');

 if(!current) return;

 if(!categories.includes(current)){
  showToast('Categoria não encontrada');
  return;
 }

 const updated = prompt('Novo nome da categoria');

 if(!updated) return;

 categories = categories.map(cat =>
  cat === current ? updated : cat
 );

 expenses.forEach(exp=>{
  if(exp.category === current){
   exp.category = updated;
  }
 });

 saveStorage();
 renderAll();

 showToast('Categoria atualizada');
}

if(action === '3'){

 const removeName = prompt('Qual categoria deseja remover?');

 if(!removeName) return;

 categories = categories.filter(cat => cat !== removeName);

 saveStorage();
 renderCategories();

 showToast('Categoria removida');
}
}

function renderCategories() {
  document.getElementById('category').innerHTML = categories
    .map(cat => `<option>${cat}</option>`)
    .join('');

  document.getElementById('categoriesList').innerHTML = categories
    .map(cat => `<div class="category-tag">${cat}</div>`)
    .join('');
}

function saveExpense(){

const expenseData = {
id: editingExpenseId || Date.now(),
value: Number(document.getElementById('value').value || 0),
category: document.getElementById('category').value,
note: document.getElementById('note').value,
date: document.getElementById('date').value
};

if(editingExpenseId){

 expenses = expenses.map(exp =>
  exp.id === editingExpenseId ? expenseData : exp
 );

 showToast('Registro atualizado');

}else{

 expenses.unshift(expenseData);

 showToast('Gasto registrado');
}

editingExpenseId = null;

saveStorage();
renderAll();

clearFields();
}

function editExpense(id){

const expense = expenses.find(exp => exp.id === id);

if(!expense) return;

editingExpenseId = id;

document.getElementById('value').value = expense.value;
document.getElementById('category').value = expense.category;
document.getElementById('note').value = expense.note;
document.getElementById('date').value = expense.date;

window.scrollTo({
 top: 0,
 behavior: 'smooth'
});

showToast('Editando registro');
}

function clearFields() {
  document.getElementById('value').value = '';
  document.getElementById('note').value = '';
  document.getElementById('date').value = '';
}

function deleteExpense(id) {
  expenses = expenses.filter(exp => exp.id !== id);
  saveStorage();
  renderAll();
}

function renderHistory() {
  const history = document.getElementById('history');

  history.innerHTML = expenses.map(exp => `
    <div class="history-card">

      <div class="flex items-start justify-between gap-4">

        <div>
          <div class="category-tag inline-flex mb-4">
            ${exp.category}
          </div>

          <h3 class="text-3xl font-bold">
            R$ ${exp.value.toFixed(2)}
          </h3>

          <p class="text-slate-500 mt-3">
            ${exp.note || 'Sem anotação'}
          </p>

          <p class="text-slate-400 mt-3 text-sm">
            ${exp.date || '-'}
          </p>
        </div>

<div class="flex gap-3">

<button onclick="editExpense(${exp.id})"
class="text-slate-500 text-2xl">
✎
</button>

<button onclick="deleteExpense(${exp.id})"
class="text-slate-500 text-2xl">
🗑
</button>

</div>

      </div>

    </div>
  `).join('');
}

let chart;

function renderChart() {
  const totals = {};

  expenses.forEach(exp => {
    totals[exp.category] = (totals[exp.category] || 0) + exp.value;
  });

  const labels = Object.keys(totals);
  const values = Object.values(totals);

  const ctx = document.getElementById('chart');

  if(chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data: values
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: 'bottom'
        }
      }
    }
  });

  const total = expenses.reduce((sum, item) => sum + item.value, 0);

  document.getElementById('totalValue').innerText = `R$ ${total.toFixed(2)}`;

  document.getElementById('totalRecords').innerText = expenses.length;

  let biggest = '-';
  let biggestValue = 0;

  Object.entries(totals).forEach(([cat, val]) => {
    if(val > biggestValue) {
      biggestValue = val;
      biggest = cat;
    }
  });

  document.getElementById('topCategory').innerText = biggest;
}

function exportBackup() {
  const data = {
    expenses,
    categories
  };

  const blob = new Blob([JSON.stringify(data)], {
    type: 'application/json'
  });

  const a = document.createElement('a');

  a.href = URL.createObjectURL(blob);
  a.download = 'jujubancas-backup.json';
  a.click();

  showToast('Backup exportado');
}

function importBackup(event) {
  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = (e) => {
    const data = JSON.parse(e.target.result);

    expenses = data.expenses || [];
    categories = data.categories || [];

    saveStorage();
    renderAll();

    showToast('Backup restaurado');
  };

  reader.readAsText(file);
}

function showToast(message) {
  const toast = document.createElement('div');

  toast.innerText = message;

  toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-pink-500 text-white px-6 py-4 rounded-2xl shadow-lg z-50';

  document.body.appendChild(toast);

  setTimeout(() => {
    toast.remove();
  }, 2200);
}

function renderAll(){
renderCategories();
renderHistory();
renderChart();
renderGoal();
}

renderAll();
</script>

</body>
</html>
