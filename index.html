<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#f9a8d4">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jujubanças</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  background: #fff8fb;
  font-family: Inter, sans-serif;
  color: #1e293b;
}

.card {
  background: white;
  border-radius: 28px;
  padding: 22px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

.input {
  width: 100%;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 18px;
  padding: 18px;
  margin-top: 8px;
  outline: none;
}

.input:focus {
  border-color: #f472b6;
}

.btn {
  border-radius: 18px;
  padding: 16px;
  font-weight: 600;
}

.category-tag {
  background: #fce7f3;
  color: #be185d;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 13px;
}

.history-card {
  border: 1px solid #f1f5f9;
  border-radius: 22px;
  padding: 18px;
}
</style>
</head>
<body>

<div class="max-w-6xl mx-auto p-5">

<div class="flex flex-col md:flex-row md:items-center justify-between gap-5 mb-8">

<div class="flex items-center gap-4">
<div class="w-16 h-16 rounded-3xl bg-pink-300 flex items-center justify-center text-3xl">
💸
</div>

<div>
<h1 class="text-4xl font-bold">Jujubanças</h1>
<p class="text-slate-500 mt-1">Controle dos pequenos gastos do dia a dia</p>
</div>
</div>

<div class="flex gap-3 flex-wrap">
<button id="installBtn" class="btn bg-pink-500 text-white hidden">
Instalar app
</button>

<button onclick="exportBackup()" class="btn bg-slate-900 text-white">
Exportar backup
</button>

<label class="btn bg-slate-200 cursor-pointer">
Importar backup
<input type="file" hidden onchange="importBackup(event)">
</label>
</div>

</div>

<div class="grid md:grid-cols-3 gap-5 mb-6">

<div class="card">
<p class="text-slate-500">Total gasto</p>
<h2 id="totalValue" class="text-4xl font-bold mt-4">R$ 0</h2>
</div>

<div class="card">
<p class="text-slate-500">Maior categoria</p>
<h2 id="topCategory" class="text-3xl font-bold mt-4">-</h2>
</div>

<div class="card">
<p class="text-slate-500">Registros</p>
<h2 id="totalRecords" class="text-4xl font-bold mt-4">0</h2>
</div>

</div>

<div class="grid lg:grid-cols-2 gap-6">

<div class="card">
<h2 class="text-2xl font-bold mb-6">Registrar gasto</h2>

<div class="space-y-5">

<div>
<label>Valor</label>
<input id="value" type="number" step="0.01" class="input" placeholder="Ex: 42.90">
</div>

<div>
<label>Categoria</label>
<div class="flex gap-2">
<select id="category" class="input"></select>

<button onclick="addCategory()" class="bg-pink-500 text-white px-5 rounded-2xl">
+
</button>
</div>
</div>

<div>
<label>Anotação</label>
<textarea id="note" class="input" placeholder="Ex: Comprei doce por impulso"></textarea>
</div>

<div>
<label>Data</label>
<input id="date" type="date" class="input">
</div>

<button onclick="saveExpense()" class="btn bg-pink-500 text-white w-full">
Registrar gasto
</button>

</div>
</div>

<div class="space-y-6">

<div class="card">
<h2 class="text-2xl font-bold mb-6">Categorias</h2>
<div id="categoriesList" class="flex flex-wrap gap-3"></div>
</div>

<div class="card">
<h2 class="text-2xl font-bold mb-6">Onde estou gastando</h2>
<canvas id="chart"></canvas>
</div>

</div>

</div>

<div class="card mt-6">
<div class="flex items-center justify-between mb-6">
<h2 class="text-2xl font-bold">Histórico</h2>
</div>

<div id="history" class="space-y-4"></div>
</div>

</div>

<script>
let expenses = JSON.parse(localStorage.getItem('jujubancas_expenses')) || [];
let categories = JSON.parse(localStorage.getItem('jujubancas_categories')) || [
  'Delivery',
  'Doces',
  'Compras impulsivas'
];

let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').classList.remove('hidden');
});

const installBtn = document.getElementById('installBtn');

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.classList.add('hidden');
});

function saveStorage() {
  localStorage.setItem('jujubancas_expenses', JSON.stringify(expenses));
  localStorage.setItem('jujubancas_categories', JSON.stringify(categories));
}

function addCategory(){

const action = prompt(
`Digite:
1 = Nova categoria
2 = Editar categoria
3 = Remover categoria`
);

if(action === '1'){

 const name = prompt('Nome da nova categoria');

 if(!name) return;

 if(!categories.includes(name)){
  categories.push(name);
  saveStorage();
  renderCategories();
 }

 document.getElementById('category').value = name;
 showToast('Categoria adicionada');
}

if(action === '2'){

 const current = prompt('Qual categoria deseja editar?');

 if(!current) return;

 if(!categories.includes(current)){
  showToast('Categoria não encontrada');
  return;
 }

 const updated = prompt('Novo nome da categoria');

 if(!updated) return;

 categories = categories.map(cat =>
  cat === current ? updated : cat
 );

 expenses.forEach(exp=>{
  if(exp.category === current){
   exp.category = updated;
  }
 });

 saveStorage();
 renderAll();

 showToast('Categoria atualizada');
}

if(action === '3'){

 const removeName = prompt('Qual categoria deseja remover?');

 if(!removeName) return;

 categories = categories.filter(cat => cat !== removeName);

 saveStorage();
 renderCategories();

 showToast('Categoria removida');
}
}

function renderCategories() {
  document.getElementById('category').innerHTML = categories
    .map(cat => `<option>${cat}</option>`)
    .join('');

  document.getElementById('categoriesList').innerHTML = categories
    .map(cat => `<div class="category-tag">${cat}</div>`)
    .join('');
}

let editingExpenseId = null;

function saveExpense(){

const expenseData = {
id: editingExpenseId || Date.now(),
value: Number(document.getElementById('value').value || 0),
category: document.getElementById('category').value,
note: document.getElementById('note').value,
date: document.getElementById('date').value
};

if(editingExpenseId){

 expenses = expenses.map(exp =>
  exp.id === editingExpenseId ? expenseData : exp
 );

 showToast('Registro atualizado');

}else{

 expenses.unshift(expenseData);

 showToast('Gasto registrado');
}

editingExpenseId = null;

saveStorage();
renderAll();

document.getElementById('value').value='';
document.getElementById('note').value='';
document.getElementById('date').value='';
}

function editExpense(id){

const expense = expenses.find(exp => exp.id === id);

if(!expense) return;

editingExpenseId = id;

document.getElementById('value').value = expense.value;
document.getElementById('category').value = expense.category;
document.getElementById('note').value = expense.note;
document.getElementById('date').value = expense.date;

window.scrollTo({
 top: 0,
 behavior: 'smooth'
});

showToast('Editando registro');
}

function clearFields() {
  document.getElementById('value').value = '';
  document.getElementById('note').value = '';
  document.getElementById('date').value = '';
}

function deleteExpense(id) {
  expenses = expenses.filter(exp => exp.id !== id);
  saveStorage();
  renderAll();
}

function renderHistory() {
  const history = document.getElementById('history');

  history.innerHTML = expenses.map(exp => `
    <div class="history-card">

      <div class="flex items-start justify-between gap-4">

        <div>
          <div class="category-tag inline-flex mb-4">
            ${exp.category}
          </div>

          <h3 class="text-3xl font-bold">
            R$ ${exp.value.toFixed(2)}
          </h3>

          <p class="text-slate-500 mt-3">
            ${exp.note || 'Sem anotação'}
          </p>

          <p class="text-slate-400 mt-3 text-sm">
            ${exp.date || '-'}
          </p>
        </div>

       <div class="flex gap-3">

<button onclick="editExpense(${exp.id})"
class="text-slate-500 text-2xl">
✎
</button>

<button onclick="deleteExpense(${exp.id})"
class="text-slate-500 text-2xl">
🗑
</button>

</div>

      </div>

    </div>
  `).join('');
}

let chart;

function renderChart() {
  const totals = {};

  expenses.forEach(exp => {
    totals[exp.category] = (totals[exp.category] || 0) + exp.value;
  });

  const labels = Object.keys(totals);
  const values = Object.values(totals);

  const ctx = document.getElementById('chart');

  if(chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data: values
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: 'bottom'
        }
      }
    }
  });

  const total = expenses.reduce((sum, item) => sum + item.value, 0);

  document.getElementById('totalValue').innerText = `R$ ${total.toFixed(2)}`;

  document.getElementById('totalRecords').innerText = expenses.length;

  let biggest = '-';
  let biggestValue = 0;

  Object.entries(totals).forEach(([cat, val]) => {
    if(val > biggestValue) {
      biggestValue = val;
      biggest = cat;
    }
  });

  document.getElementById('topCategory').innerText = biggest;
}

function exportBackup() {
  const data = {
    expenses,
    categories
  };

  const blob = new Blob([JSON.stringify(data)], {
    type: 'application/json'
  });

  const a = document.createElement('a');

  a.href = URL.createObjectURL(blob);
  a.download = 'jujubancas-backup.json';
  a.click();

  showToast('Backup exportado');
}

function importBackup(event) {
  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = (e) => {
    const data = JSON.parse(e.target.result);

    expenses = data.expenses || [];
    categories = data.categories || [];

    saveStorage();
    renderAll();

    showToast('Backup restaurado');
  };

  reader.readAsText(file);
}

function showToast(message) {
  const toast = document.createElement('div');

  toast.innerText = message;

  toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-pink-500 text-white px-6 py-4 rounded-2xl shadow-lg z-50';

  document.body.appendChild(toast);

  setTimeout(() => {
    toast.remove();
  }, 2200);
}

function renderAll() {
  renderCategories();
  renderHistory();
  renderChart();
}

renderAll();
</script>

</body>
</html>
